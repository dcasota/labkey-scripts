[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-sample-manager"
version = "0.1.0"
description = "Open Sample Manager: sample lifecycle, freezer map, workflow, ELN, audit and LabKey publishing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Casota", email = "dcasota@gmail.com" }]
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "labkey: integration test requiring a reachable LabKey server and LK_* credentials",
]
filterwarnings = [
    "error",
    # Loopback HTTPS uses a self-signed certificate, so an unverified request is
    # the expected, documented behaviour (ADR-0008). Leaving the warning on
    # trains readers to ignore warnings; the policy itself is covered by
    # tests/test_labkey_config.py.
    "ignore::urllib3.exceptions.InsecureRequestWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tools", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
